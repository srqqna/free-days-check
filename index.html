<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เพื่อนว่างวันไหน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: one column — my-name bar, calendar heatmap (tap to mark), then best days + who's in */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18212e; --muted:#5d6878; --line:#dde2ea;
  --accent:#0f6f7a; --accent-ink:#ffffff; --mine:#e8a317;
  --h0:#eef1f5; --h1:#cfe8e9; --h2:#9fd1d4; --h3:#5fb0b6; --h4:#0f6f7a;
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e7ecf2; --muted:#98a3b3; --line:#2a3542;
  --accent:#4fc0c8; --accent-ink:#0b1a1d; --mine:#f2b84b;
  --h0:#1e2833; --h1:#1d3d43; --h2:#22595f; --h3:#2b8088; --h4:#4fc0c8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e7ecf2; --muted:#98a3b3; --line:#2a3542;
  --accent:#4fc0c8; --accent-ink:#0b1a1d; --mine:#f2b84b;
  --h0:#1e2833; --h1:#1d3d43; --h2:#22595f; --h3:#2b8088; --h4:#4fc0c8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,5vw,2.2rem);margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:1.1rem;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.me{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.me label{font-weight:600}
.me input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.me input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:#c0392b}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead .month{font-family:var(--font-display);font-weight:600;font-size:1.15rem}
.nav{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:1.1rem}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.day{position:relative;aspect-ratio:1/1;max-width:100%;border:2px solid transparent;border-radius:10px;background:var(--h0);color:var(--ink);
  font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.day .n{font-weight:600;font-size:1rem}
.day .c{font-size:.7rem;opacity:.85}
.day[data-l="1"]{background:var(--h1)} .day[data-l="2"]{background:var(--h2)}
.day[data-l="3"]{background:var(--h3);color:var(--accent-ink)} .day[data-l="4"]{background:var(--h4);color:var(--accent-ink)}
.day.mine{border-color:var(--mine)}
.day.mine::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--mine)}
.day.past{opacity:.35;cursor:default}
.day.blank{visibility:hidden}
.day.today .n{text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.ramp{display:inline-flex;gap:2px;vertical-align:-2px;margin-right:4px}
.ramp i{width:12px;height:14px;border-radius:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
ol.best{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ol.best li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.best .d{font-weight:600}
.best .k{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;grid-row:span 2}
.best .who{grid-column:2;font-size:.82rem;color:var(--muted)}
ul.people{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.people li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.people .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.people .ct{color:var(--muted);font-size:.85rem;white-space:nowrap}
.rm{font:inherit;font-size:.78rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:2px 8px;cursor:pointer}
.rm.confirm{border-color:#c0392b;color:#c0392b}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.notice{background:var(--h1);border-radius:10px;padding:10px 12px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.day{transition:background .15s,border-color .15s}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.copy{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
#eventname{font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>เพื่อนว่างวันไหน</h1>
    <p class="sub" id="eventname" hidden></p>
    <p class="sub">ใส่ชื่อ แล้วแตะวันที่ตัวเองว่าง สีเข้ม = ว่างกันหลายคน</p>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="panel">
    <div class="me">
      <label for="myname">ชื่อเรา</label>
      <input id="myname" maxlength="40" placeholder="เช่น ต้น, มิ้นท์" autocomplete="nickname">
    </div>
    <div class="row"><div class="status" id="status">กำลังโหลด…</div><button class="copy" id="copy" type="button">คัดลอกลิงก์ส่งเพื่อน</button></div>
  </section>

  <section class="panel" aria-label="ปฏิทิน">
    <div class="calhead">
      <button class="nav" id="prev" aria-label="เดือนก่อน">‹</button>
      <div class="month" id="month"></div>
      <button class="nav" id="next" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="ramp"><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i></span>ว่างน้อย → ว่างมาก</span>
      <span><span class="sw" style="border:2px solid var(--mine)"></span>วันที่เราว่าง</span>
    </div>
  </section>

  <div class="cols">
    <section class="panel">
      <h2>วันที่ว่างตรงกันมากสุด</h2>
      <ol class="best" id="best"></ol>
    </section>
    <section class="panel">
      <h2>ใครลงแล้วบ้าง <span id="pc" class="status"></span></h2>
      <ul class="people" id="people"></ul>
    </section>
  </div>
</div>

<script type="module">
// ===== 1) วาง firebaseConfig ของคุณตรงนี้ (Firebase Console > Project settings > Your apps > Web app) =====
const firebaseConfig = {

  apiKey: "AIzaSyAVd4FanRvcHwPnQIhNm-EtmhgXw5jCwbU",

  authDomain: "free-days-cc74e.firebaseapp.com",

  projectId: "free-days-cc74e",

  storageBucket: "free-days-cc74e.firebasestorage.app",

  messagingSenderId: "689418453976",

  appId: "1:689418453976:web:52a953794da20b8127e8ad",

  measurementId: "G-77NLJNECPN"

};

// =====================================================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TH_MONTH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_MON_S=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
const TH_DOW_L=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=new Date();today.setHours(0,0,0,0);
const todayKey=key(today);
const $=id=>document.getElementById(id);

// แยกหลายนัดด้วย ?event=ชื่อนัด (ตัวอักษรอังกฤษ ตัวเลข - _)
const params=new URLSearchParams(location.search);
const eventId=(params.get("event")||"main").replace(/[^A-Za-z0-9_-]/g,"").slice(0,60)||"main";
if(eventId!=="main"){$("eventname").textContent="นัด: "+eventId;$("eventname").hidden=false}

let view=new Date(today.getFullYear(),today.getMonth(),1);
let people={};            // uid -> {name,dates}
let myId=null, myDates=new Set(), myName="", ready=false, loaded=false;
const demo=firebaseConfig.apiKey.startsWith("PASTE");
let saveTimer=null, saving=false, pending=false, ref=null;

try{myName=localStorage.getItem("ffd-name")||""}catch(e){}
$("myname").value=myName;
$("dows").innerHTML=TH_DOW.map(d=>`<div class="dow">${d}</div>`).join("");

function setStatus(t,err){const s=$("status");s.textContent=t;s.classList.toggle("err",!!err)}

// รวมข้อมูลทุกคน โดยใช้ค่าของเราที่แก้อยู่ในเครื่องแทนค่าจากเซิร์ฟเวอร์
function merged(){
  const all={...people};
  if(myId&&(myDates.size||all[myId]))all[myId]={name:myName||"เรา",dates:[...myDates]};
  return all;
}

function render(){
  const all=merged(), ids=Object.keys(all), tot=Math.max(ids.length,1), m={};
  for(const id of ids)for(const d of (all[id].dates||[]))(m[d]=m[d]||[]).push(all[id].name||"ไม่ระบุชื่อ");

  $("month").textContent=TH_MONTH[view.getMonth()]+" "+(view.getFullYear()+543);
  $("prev").disabled=view<=new Date(today.getFullYear(),today.getMonth(),1);
  const first=view.getDay(), days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";
  for(let i=0;i<first;i++)h+=`<div class="day blank"></div>`;
  for(let d=1;d<=days;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d), k=key(dt), past=dt<today;
    const c=(m[k]||[]).length, lvl=c?Math.min(4,Math.ceil(c/tot*4)):0;
    const cls=["day",past?"past":"",myDates.has(k)?"mine":"",k===todayKey?"today":""].join(" ");
    h+=`<button class="${cls}" data-k="${k}" data-l="${lvl}" ${past?"disabled":""} aria-pressed="${myDates.has(k)}" aria-label="${d} ${TH_MONTH[view.getMonth()]} ว่าง ${c} คน"><span class="n">${d}</span>${c?`<span class="c">${c} คน</span>`:""}</button>`;
  }
  $("grid").innerHTML=h;

  const ranked=Object.entries(m).filter(([k])=>k>=todayKey).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0])).slice(0,6);
  const best=$("best");best.innerHTML="";
  if(!ranked.length)best.innerHTML=`<li class="empty">ยังไม่มีใครเลือกวัน ลองแตะวันในปฏิทินดู</li>`;
  for(const [k,names] of ranked){
    const [y,mo,d]=k.split("-").map(Number), dt=new Date(y,mo-1,d);
    const li=document.createElement("li");
    li.innerHTML=`<span class="k"></span><span class="d"></span><span class="who"></span>`;
    li.querySelector(".k").textContent=names.length+"/"+tot;
    li.querySelector(".d").textContent=`${TH_DOW_L[dt.getDay()]} ${d} ${TH_MON_S[mo-1]}`;
    li.querySelector(".who").textContent=names.join(", ");
    best.appendChild(li);
  }

  const ul=$("people");ul.innerHTML="";
  $("pc").textContent=ids.length?`(${ids.length} คน)`:"";
  if(!ids.length)ul.innerHTML=`<li class="empty">${loaded?"ยังไม่มีใครลง ส่งลิงก์ให้เพื่อนได้เลย":"กำลังโหลด…"}</li>`;
  for(const id of ids){
    const p=all[id], li=document.createElement("li");
    const nm=document.createElement("span");nm.className="nm";nm.textContent=(p.name||"ไม่ระบุชื่อ")+(id===myId?" (เรา)":"");
    const ct=document.createElement("span");ct.className="ct";ct.textContent=(p.dates||[]).filter(d=>d>=todayKey).length+" วัน";
    li.append(nm,ct);ul.appendChild(li);
  }
}

$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".day");if(!b||b.disabled)return;
  if(!ready&&!demo){setStatus("ยังเชื่อมต่อไม่เสร็จ รอสักครู่",true);return}
  const k=b.dataset.k;myDates.has(k)?myDates.delete(k):myDates.add(k);
  if(demo)myId="local";
  render();queueSave();
});
$("myname").addEventListener("input",e=>{myName=e.target.value.trim();try{localStorage.setItem("ffd-name",myName)}catch(_){}render();queueSave()});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("copy").onclick=async()=>{
  const url=location.href;
  try{await navigator.clipboard.writeText(url);$("copy").textContent="คัดลอกแล้ว"}
  catch(e){prompt("คัดลอกลิงก์นี้",url)}
  setTimeout(()=>$("copy").textContent="คัดลอกลิงก์ส่งเพื่อน",2000);
};

function queueSave(){
  if(!ready)return;
  if(!myName){setStatus("ใส่ชื่อก่อน แล้วระบบจะบันทึกให้อัตโนมัติ",true);return}
  setStatus("กำลังบันทึก…");
  clearTimeout(saveTimer);saveTimer=setTimeout(save,700);
}
async function save(){
  if(saving){pending=true;return}
  saving=true;
  const dates=[...myDates].filter(d=>d>=todayKey).sort().slice(0,400);
  try{
    if(!dates.length&&!people[myId])setStatus("แตะวันที่ว่างได้เลย");
    else if(!dates.length){await deleteDoc(ref);setStatus("ลบวันว่างของเราแล้ว")}
    else{await setDoc(ref,{name:myName.slice(0,40),dates,updatedAt:serverTimestamp()});setStatus("บันทึกแล้ว เพื่อนเห็นทันที")}
  }catch(e){console.error(e);setStatus("บันทึกไม่สำเร็จ ("+(e.code||"error")+") ลองใหม่อีกครั้ง",true)}
  saving=false;if(pending){pending=false;save()}
}

render();

if(demo){
  const n=$("notice");n.hidden=false;
  n.textContent="ยังไม่ได้ใส่ firebaseConfig ในไฟล์ index.html ดูขั้นตอนในคู่มือ ตอนนี้แตะได้ แต่ข้อมูลจะไม่ถูกบันทึก";
  setStatus("โหมดตัวอย่าง");loaded=true;ready=false;
  render();
}else{
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app), fs=getFirestore(app);
  const timer=setTimeout(()=>{if(!loaded){const n=$("notice");n.hidden=false;n.textContent="ยังเชื่อมต่อฐานข้อมูลไม่ได้ เช็กอินเทอร์เน็ต หรือเช็กการตั้งค่า Firebase"}},10000);
  onAuthStateChanged(auth,user=>{
    if(!user||myId)return;
    myId=user.uid;ready=true;
    ref=doc(fs,"events",eventId,"people",myId);
    setStatus(myName?"พร้อมแล้ว แตะวันที่ว่างได้เลย":"ใส่ชื่อ แล้วแตะวันที่ว่าง");
    let first=true;
    onSnapshot(collection(fs,"events",eventId,"people"),snap=>{
      const next={};snap.forEach(d=>{next[d.id]=d.data()});
      people=next;
      if(first&&people[myId]){
        myDates=new Set((people[myId].dates||[]).filter(d=>d>=todayKey));
        if(!$("myname").value&&people[myId].name){myName=people[myId].name;$("myname").value=myName}
      }
      first=false;loaded=true;clearTimeout(timer);$("notice").hidden=true;render();
    },err=>{console.error(err);loaded=true;clearTimeout(timer);const n=$("notice");n.hidden=false;n.textContent="โหลดข้อมูลไม่ได้ ("+err.code+") เช็ก Firestore rules";render()});
  });
  signInAnonymously(auth).catch(e=>{console.error(e);setStatus("เข้าระบบไม่ได้ ("+e.code+") เช็กว่าเปิด Anonymous sign-in แล้ว",true)});
}
</script>
</body>
</html>
